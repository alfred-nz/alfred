name: Release Alfred
# Push a tag like v0.2.0 to build both packages and publish them as a GitHub release.
# Assets use fixed names so alfred.nz can link to releases/latest/download/<name>.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45 # notarization usually takes minutes, occasionally longer
    env:
      MAC_SIGN_IDENTITY: 'Developer ID Application: Valkohelmi Oy (4CA9Q5448J)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(openssl rand -hex 16)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          curl -sfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - run: npm run package:mac
      - name: Build the DMG, notarize it and staple the tickets
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash scripts/notarize-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/Alfred-mac-arm64.zip*
            release/Alfred-mac-arm64.dmg*
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run build
      - run: npm run package:windows
      - run: npm run test:windows
      - shell: bash
        run: |
          cd release && cp Alfred-*-windows-x64.zip Alfred-windows-x64.zip
          sha256sum Alfred-windows-x64.zip > Alfred-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Alfred-windows-x64.zip*
  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" --title "Alfred $GITHUB_REF_NAME" --notes "Early preview. The Mac app is signed and notarized by Apple (Apple Silicon). The Windows build is not signed yet, so Windows warns you the first time you open Alfred."
